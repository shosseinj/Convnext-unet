project: Convnext-unet-main
seeds: [42, 3407, 2026]
reuse_duplicate_variants: true
metrics: [dice, iou, precision, recall, specificity, pixel_accuracy, mae]
input_size: [352, 352]

incremental:
  - id: baseline
    msc: false
    lrse: false
    detail_branch: false
    gdf: false
    deep_supervision_heads: 0
  - id: baseline_msc
    msc: true
    lrse: false
    detail_branch: false
    gdf: false
    deep_supervision_heads: 0
  - id: baseline_msc_lrse
    msc: true
    lrse: proposed
    detail_branch: false
    gdf: false
    deep_supervision_heads: 0
  - id: baseline_msc_lrse_detail
    msc: true
    lrse: proposed
    detail_branch: 32
    gdf: false
    deep_supervision_heads: 0
  - id: baseline_msc_lrse_detail_gdf
    msc: true
    lrse: proposed
    detail_branch: 32
    gdf: proposed
    deep_supervision_heads: 0
  - id: full
    msc: true
    lrse: proposed
    detail_branch: 32
    gdf: proposed
    deep_supervision_heads: 3

special:
  backbones: [resnet34, efficientnet, convnext_tiny]
  lrse_modes: [normal_skip, attention_gate, proposed]
  gdf_modes: [addition, concatenation, attention_fusion, proposed]
  msc_branch_counts: [2, 3, 4, 5]
  msc_dilation_sets: [[1, 2, 3], [1, 3, 5], [1, 3, 7]]
  detail_channels: [0, 16, 32, 64]
  deep_supervision_heads: [0, 1, 2, 3]

size_bins:
  small_max_area_ratio: 0.05
  medium_max_area_ratio: 0.20
