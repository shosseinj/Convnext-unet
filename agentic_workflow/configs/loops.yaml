loops:
  audit_repair:
    max_iterations: 2
    stop_when: convnext_audit_pass
  implementation_repair:
    max_iterations: 3
    stop_when: targeted_tests_and_review_pass
  training_recovery:
    max_iterations: 2
    stop_when: official_run_validation_pass
    resume_required_when_valid_checkpoint_exists: true
  ugbr_revision:
    max_iterations: 2
    allowed_changes:
      - uncertainty formulation
      - boundary feature projection
      - gated fusion
      - loss term implementation correction
    forbidden:
      - changing dataset split
      - selecting test set for checkpointing
      - hiding failed runs
      - claiming target Dice before measurement
