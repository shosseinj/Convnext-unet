version: 1
entry: RECONCILE_CURRENT_REPO
nodes:
  RECONCILE_CURRENT_REPO:
    agent: repo-reconciler
    pass: STOP_OLD_CAMPAIGN
  STOP_OLD_CAMPAIGN:
    agent: process-safety
    pass: CONVNEXT_AUDIT
  CONVNEXT_AUDIT:
    agent: convnext-auditor
    pass: IMPLEMENTATION_GAP_ANALYSIS
    fail: AUDIT_REPAIR_LOOP
  AUDIT_REPAIR_LOOP:
    agent: architecture-engineer
    pass: CONVNEXT_AUDIT
    max_iterations: 2
  IMPLEMENTATION_GAP_ANALYSIS:
    agent: orchestrator
    pass: IMPLEMENT_OR_RECONCILE_UGBR
  IMPLEMENT_OR_RECONCILE_UGBR:
    agents: [architecture-engineer, loss-engineer]
    pass: TARGETED_VERIFICATION
  TARGETED_VERIFICATION:
    agents: [validator, reviewer]
    pass: PILOT_SEED_42
    fail: IMPLEMENTATION_REPAIR_LOOP
  IMPLEMENTATION_REPAIR_LOOP:
    agents: [architecture-engineer, loss-engineer]
    pass: TARGETED_VERIFICATION
    max_iterations: 3
  PILOT_SEED_42:
    agent: experiment-runner
    pass: PILOT_VALIDATION
  PILOT_VALIDATION:
    agent: validator
    pass: PILOT_RESULT_GATE
    fail: TRAINING_RECOVERY_LOOP
  TRAINING_RECOVERY_LOOP:
    agents: [process-safety, experiment-runner]
    pass: PILOT_VALIDATION
    max_iterations: 2
  PILOT_RESULT_GATE:
    agents: [result-analyst, reviewer]
    promote: THREE_SEED_RUNS
    revise: UGBR_REVISION_LOOP
    stop: STOP_NO_GAIN
  UGBR_REVISION_LOOP:
    agents: [architecture-engineer, loss-engineer]
    pass: TARGETED_VERIFICATION
    max_iterations: 2
  THREE_SEED_RUNS:
    agent: experiment-runner
    pass: FINAL_VALIDATION
  FINAL_VALIDATION:
    agents: [validator, result-analyst, reviewer]
    pass: COMPLETE
    fail: STOP_FAILED_GATE
terminal_nodes: [COMPLETE, STOP_NO_GAIN, STOP_FAILED_GATE]
