<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="260" viewBox="0 0 1100 260">
  <style>.box{fill:#f7f7fb;stroke:#343a40;stroke-width:2}.gate{fill:#fff3cd;stroke:#856404;stroke-width:2}.ok{fill:#d4edda;stroke:#155724;stroke-width:2}.t{font:18px Arial,sans-serif;fill:#202124}.s{font:14px Arial,sans-serif;fill:#40464d}.a{stroke:#555;stroke-width:2;marker-end:url(#m)}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs>
  <rect class="box" x="20" y="70" width="190" height="100" rx="8"/><text class="t" x="42" y="108">Canonical matrix</text><text class="s" x="42" y="136">14 independent controls</text><text class="s" x="42" y="157">explicit reuse mappings</text>
  <line class="a" x1="210" y1="120" x2="270" y2="120"/>
  <rect class="gate" x="275" y="70" width="190" height="100" rx="8"/><text class="t" x="299" y="108">18-run gate</text><text class="s" x="299" y="136">must pass first</text><text class="s" x="299" y="157">no test-set tuning</text>
  <line class="a" x1="465" y1="120" x2="525" y2="120"/>
  <rect class="box" x="530" y="70" width="190" height="100" rx="8"/><text class="t" x="550" y="108">Control runs</text><text class="s" x="550" y="136">3 prespecified seeds</text><text class="s" x="550" y="157">raw evidence retained</text>
  <line class="a" x1="720" y1="120" x2="780" y2="120"/>
  <rect class="ok" x="785" y="70" width="290" height="100" rx="8"/><text class="t" x="809" y="108">Validate and aggregate</text><text class="s" x="809" y="136">fixed checkpoint and metrics</text><text class="s" x="809" y="157">then manuscript promotion</text>
</svg>
