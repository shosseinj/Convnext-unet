project: Convnext-unet-main
input_size: [352, 352]
seeds: [42, 3407, 2026]
datasets:
  development: [Kvasir-SEG, CVC-ClinicDB]
  external_test_only: [CVC-300, CVC-ColonDB, ETIS-LARIBPOLYPDB]
split:
  validation_fraction: 0.10
  persist_manifests: true
training:
  max_epochs: 150
  freeze_encoder_epochs: 10
  batch_size: 8
  num_workers: 0
  optimizer: AdamW
  encoder_lr: 1.0e-5
  decoder_lr: 1.0e-4
  weight_decay: 1.0e-4
  early_stopping_patience: 30
  tta: false
  scheduler: cosine_annealing
  loss:
    name: dice_bce_boundary
    dice_weight: 0.30
    bce_weight: 0.30
    boundary_weight: 0.40
    boundary_kappa: 5.0
    label_smoothing: 0.02
    deep_supervision_weights: [1.0, 0.1, 0.05, 0.02]
  augmentation:
    horizontal_flip_probability: 0.5
    vertical_flip_probability: 0.5
    rotation_probability: 0.5
    rotation_degrees: 15
    crop_probability: 0.5
    crop_ratio: [0.7, 1.0]
    photometric_probability: 0.5
    blur_probability: 0.15
    noise_probability: 0.25
    noise_std: 0.015
selection:
  metric: mean_validation_dice
  formula: (kvasir_val_dice + clinicdb_val_dice) / 2
  forbid_test_dataset_selection: true
reporting:
  metrics: [dice, iou, precision, recall, specificity, pixel_accuracy, mae]
  standard_deviation: sample
  size_bins:
    small: "area_ratio < 0.05"
    medium: "0.05 <= area_ratio <= 0.20"
    large: "area_ratio > 0.20"
pilot:
  seed: 42
  epochs: 12
  max_train_batches_per_epoch: 25
  max_validation_batches: 0
  eligible_for_manuscript: false
